apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: platform
  namespace: argocd

  annotations:
    # Projektet får inte raderas automatiskt utan godkännande.
    argocd.argoproj.io/sync-options: Prune=confirm

spec:
  description: Argo CD project for platform and GitOps administration.

  # Plattformskonfigurationen får endast läsas från detta repository.
  sourceRepos:
    - https://github.com/linkmush/Restaurant_Template_2_Yaml.git

    - https://bitnami.github.io/sealed-secrets

  # Projektet får endast deploya till dessa namespaces.
  destinations:
    # Argo CD-bootstrapresurser.
    - namespace: argocd
      server: https://kubernetes.default.svc

    # Sealed Secrets-controller.
    - namespace: kube-system
      server: https://kubernetes.default.svc

  # Bootstrap behöver just nu endast hantera dessa två resurstyper.
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject

    - group: argoproj.io
      kind: ApplicationSet

    - group: argoproj.io
      kind: Application

    # Sealed Secrets Helm-chart.
    #
    # Service och ServiceAccount tillhör Kubernetes core API group.
    # Core-gruppen skrivs som en tom sträng.
    - group: ""
      kind: ServiceAccount

    - group: ""
      kind: Service

    - group: apps
      kind: Deployment

    - group: rbac.authorization.k8s.io
      kind: Role

    - group: rbac.authorization.k8s.io
      kind: RoleBinding

  # Cluster-omfattande resurser som projektet får skapa.
  clusterResourceWhitelist:
    # SealedSecret-typen installeras som en CRD.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    # Sealed Secrets-controllerns cluster-wide RBAC.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
