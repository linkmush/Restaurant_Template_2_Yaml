apiVersion: apps/v1
kind: Deployment

metadata:
  name: config-demo

  labels:
    app: config-demo
    app.kubernetes.io/name: config-demo
    app.kubernetes.io/component: configuration-demo

spec:
  replicas: 1

  # Behåll ett fåtal äldre ReplicaSets för felsökning och rollback.
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: config-demo

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: config-demo
        app.kubernetes.io/name: config-demo
        app.kubernetes.io/component: configuration-demo

    spec:
      serviceAccountName: config-demo

      # Podden behöver inte Kubernetes API-token.
      automountServiceAccountToken: false

      # Alla vanliga workloads ska ligga på applications-noder.
      nodeSelector:
        node-pool: applications

      terminationGracePeriodSeconds: 10

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: config-demo

          # Versionslåst tagg. Vi använder inte latest.
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Config demo started"

              while true; do
                sleep 3600
              done

          env:
            # Vanlig konfiguration från ConfigMap.

            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: config-demo-config
                  key: APP_ENVIRONMENT

            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: config-demo-config
                  key: API_URL

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: config-demo-config
                  key: LOG_LEVEL

            # Känsligt värde från Kubernetes Secret.

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: config-demo-secret
                  key: DATABASE_PASSWORD

          resources:
            requests:
              cpu: 10m
              memory: 16Mi

            limits:
              cpu: 100m
              memory: 64Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL
