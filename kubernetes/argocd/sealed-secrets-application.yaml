apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sealed-secrets
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.1

    helm:
      releaseName: sealed-secrets

      values: |
        # Namnet matchar vad kubeseal normalt förväntar sig.
        fullnameOverride: sealed-secrets-controller

        revisionHistoryLimit: 3

        # Controllern är en plattformskomponent.
        nodeSelector:
          node-pool: platform

        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule

        resources:
          requests:
            cpu: 50m
            memory: 64Mi

          limits:
            cpu: 250m
            memory: 256Mi

        # Skapa proxier-rollen men bind den inte automatiskt
        # till alla autentiserade Kubernetes-användare.
        rbac:
          serviceProxier:
            create: true
            bind: false

        metrics:
          serviceMonitor:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
